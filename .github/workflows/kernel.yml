name: Darwin 23 platform kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'configs/ defconfig name (polaris_defconfig or polaris_prelink_defconfig)'
        default: 'polaris_defconfig'
        type: string
permissions:
  contents: read
jobs:
  kernel:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 37987aea410691df3c1e0e146a1bfd6127932149
          path: out/upstream
      - name: Tools
        run: |
          brew install cmake ninja unifdef llvm lld
          # The late Darwin 23 source has split IPC messages. Xcode 16.2's
          # public MIG/IIG still emit the older ABI (see sweet NOTES); this
          # Xcode 26.2 image provides the matching generators.
          XC=/Applications/Xcode_26.2.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --find mig
          xcrun --sdk iphoneos --find iig
      - name: Build source kernel and platform drivers
        run: python3 scripts/build-platform-kernel.py --base out/upstream -j 4 --defconfig ${{ inputs.defconfig }}
      - name: Preserve compile records and generated headers
        if: always()
        run: |
          TREE=out/native/polaris/tree
          if [ -d "$TREE/.cache/xnu-work" ] && [ -d "$TREE/build/xnu" ]; then
            tar czf out/native-buildtree.tgz --exclude='.git' --exclude='*.o' --exclude='*.cpo' --exclude='*.a' -C "$TREE" .cache/xnu-work .cache/fakeroot build/xnu
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-kernel-results
          path: |
            out/native/polaris/kernel/

  native-check:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-kernel-results
          path: out/kernel
      - name: EFI binaries from the latest green checks run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" -w checks.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN"
          gh run download -R "$GITHUB_REPOSITORY" "$RUN" -n efi-results -D out/efi
          ls out/efi out/kernel
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 clang llvm lld
      - name: QEMU native platform check
        if: inputs.defconfig == 'polaris_defconfig'
        run: python3 scripts/check-platform-kernel.py --kernel out/kernel/kernel.macho --efi out/efi
      - name: Assemble the polaris payload ESP
        if: inputs.defconfig == 'polaris_defconfig'
        run: python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-esp --cpus 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-check-results
          path: |
            out/platform-check/report.json
            out/platform-check/serial.log
            out/platform-check/screen.ppm
            out/polaris-esp/
